name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Собрать APK
        working-directory: android
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Выложить APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk V31-Pult.apk
          gh release create "android-${{ github.run_number }}" V31-Pult.apk \
            --repo "${{ github.repository }}" \
            --title "V31 Пульт для Android, сборка ${{ github.run_number }}" \
            --notes "Скачайте V31-Pult.apk на планшет и откройте его." \
            --latest
