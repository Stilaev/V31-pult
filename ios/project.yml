# Проект Xcode собирается из этого файла программой XcodeGen:
#   brew install xcodegen && cd ios && xcodegen generate && open V31Pult.xcodeproj
name: V31Pult
options:
  bundleIdPrefix: ru.v31
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  V31Pult:
    type: application
    platform: iOS
    sources:
      - path: V31Pult
      # интерфейс пульта — общая папка web (копируется в приложение целиком)
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: V31Pult/Info.plist
      properties:
        CFBundleDisplayName: V31 Пульт
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        NSBluetoothAlwaysUsageDescription: Bluetooth нужен, чтобы подключиться к модулю Roland V31 по Bluetooth MIDI.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.v31.pult
        PRODUCT_NAME: V31Pult
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
